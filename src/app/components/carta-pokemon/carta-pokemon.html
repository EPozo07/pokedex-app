<div class="carta-pokemon" (click)="showActionSheet = true">
    <img [src]="'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/' + pokemon.url.split('/')[6] + '.png'" [alt]="pokemon.name">
    <h3>{{ pokemon.name }}</h3>
</div>

<ion-action-sheet
  [isOpen]="showActionSheet"
  [header]="pokemon.name | titlecase"
  [buttons]="actionSheetButtons"
  (didDismiss)="showActionSheet = false">
</ion-action-sheet>

<ion-toast
  [isOpen]="showToast"
  [message]="toastMessage"
  [color]="toastColor"
  duration="2000"
  position="bottom"
  (didDismiss)="showToast = false">
</ion-toast>
