<ion-header>
  <ion-toolbar color="danger">
    <ion-buttons slot="start">
      <ion-button routerLink="/perfil" fill="clear" color="light">
         Mi perfil
      </ion-button>
    </ion-buttons>
    <ion-title color="light">Pokédex</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrarSesion()" fill="outline" color="light">
        Cerrar sesión
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar color="danger">
    <ion-buttons slot="start">
      <ion-button routerLink="/favoritos" fill="clear" color="light">
         Favoritos
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button routerLink="/about" fill="clear" color="light">
        Sobre mí
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <p class="subtitulo">Elige una generación</p>

  <div class="generaciones-grid">
    @for (gen of generaciones; track gen.id) {
      <ion-card [routerLink]="['/generacion', gen.id]" class="gen-card">
        <img [src]="gen.imagen" [alt]="gen.nombre">
        <ion-card-header>
          <ion-card-title>{{ gen.nombre }}</ion-card-title>
          <ion-card-subtitle>{{ gen.region }}</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
          {{ gen.cantidad }} pokémon
        </ion-card-content>
      </ion-card>
    }
  </div>
</ion-content>
