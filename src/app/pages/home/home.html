<div class="home-container">
  <h1>Pokédex</h1>
  <p class="subtitulo">Elige una generación</p>

 

  <div class="generaciones-grid">
    @for (gen of generaciones; track gen.id) {
      <div class="gen-card" [routerLink]="['/generacion', gen.id]">
        <img [src]="gen.imagen" [alt]="gen.nombre">
        <h2>{{ gen.nombre }}</h2>
        <p>{{ gen.region }}</p>
        <span>{{ gen.cantidad }} pokémon</span>
      </div>
    }
     <div class="botones-nav">
    <a routerLink="/favoritos" class="boton-nav"> Favoritos</a>
    <a routerLink="/about" class="boton-nav">Sobre mí</a>
  </div>
  </div>
</div>
