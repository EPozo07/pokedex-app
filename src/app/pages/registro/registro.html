<ion-content>
  <div class="login-container">
    <ion-card class="login-card">
      
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png" alt="eevee" class="login-img">
      
      <ion-card-header>
        <ion-card-title>Pokédex</ion-card-title>
        <ion-card-subtitle>Crea tu cuenta</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-list>
          <ion-item>
            <ion-input
              type="email"
              placeholder="Email"
              [(ngModel)]="email"
              label="Email"
              labelPlacement="floating">
            </ion-input>
          </ion-item>

          <ion-item>
            <ion-input
              type="password"
              placeholder="Contraseña"
              [(ngModel)]="password"
              label="Contraseña"
              labelPlacement="floating">
            </ion-input>
          </ion-item>

          <ion-item>
            <ion-input
              type="password"
              placeholder="Confirmar contraseña"
              [(ngModel)]="confirmPassword"
              (keyup.enter)="register()"
              label="Confirmar contraseña"
              labelPlacement="floating">
            </ion-input>
          </ion-item>
        </ion-list>

        @if (error) {
          <ion-text color="danger">
            <p class="error">{{ error }}</p>
          </ion-text>
        }

        <ion-button 
          expand="block" 
          color="danger"
          (click)="register()" 
          [disabled]="loading"
          class="btn-login">
          {{ loading ? 'Cargando...' : 'Registrarse' }}
        </ion-button>

        <p class="registro-link">
          ¿Ya tienes cuenta? 
          <a routerLink="/login">Inicia sesión</a>
        </p>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
