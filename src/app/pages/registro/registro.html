<div class="login-container">
  <div class="login-card">
    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png" alt="eevee" class="login-img">
    <h1>Pokédex</h1>
    <p class="subtitulo">Crea tu cuenta</p>

    <div class="form-group">
      <input 
        type="email" 
        placeholder="Email" 
        [(ngModel)]="email"
        class="input-field">
    </div>

    <div class="form-group">
      <input 
        type="password" 
        placeholder="Contraseña" 
        [(ngModel)]="password"
        class="input-field">
    </div>

    <div class="form-group">
      <input 
        type="password" 
        placeholder="Confirmar contraseña" 
        [(ngModel)]="confirmPassword"
        (keyup.enter)="register()"
        class="input-field">
    </div>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <button (click)="register()" [disabled]="loading" class="btn-login">
      {{ loading ? 'Cargando...' : 'Registrarse' }}
    </button>

    <p class="registro-link">
      ¿Ya tienes cuenta? 
      <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
